name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

# This job runs PR-head code. Its token must stay read-only, so that code can
# never post a "publication-policy" status or a check run (Issue #44).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the deterministic quality gate
        run: node scripts/verify.js
      - name: Run the offline Observatory measurement tests
        run: node --test scripts/test/observatory.test.js scripts/test/publication.test.js
